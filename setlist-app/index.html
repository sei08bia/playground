<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131f">
  <title>セトリノート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a href="#/" class="logo">セトリノート</a>
  </header>

  <main id="app"></main>

  <dialog id="share-dialog">
    <form method="dialog" class="dialog-body">
      <h2>シェア</h2>
      <label class="check">
        <input type="checkbox" id="share-include-memo" checked>
        曲ごとの感想・MCメモも含める
      </label>
      <div class="share-actions">
        <button type="button" data-share="x">X(Twitter)にポスト</button>
        <button type="button" data-share="image">画像を作る</button>
        <button type="button" data-share="link">閲覧用リンクをコピー</button>
        <button type="button" data-share="text">テキストをコピー</button>
      </div>
      <img id="share-preview" alt="シェア画像のプレビュー" hidden>
      <div id="share-image-actions" class="share-actions" hidden>
        <button type="button" data-share="image-native">画像をシェア</button>
        <button type="button" data-share="image-download">画像を保存</button>
      </div>
      <p id="share-status" class="hint" role="status"></p>
      <button value="close" class="secondary">閉じる</button>
    </form>
  </dialog>

  <dialog id="picker-dialog">
    <div class="picker-body">
      <div class="row picker-head" id="picker-head"></div>
      <section class="mini-setlist" aria-label="いまのセトリ">
        <div class="row mini-head">
          <span class="grow">いまのセトリ <span class="hint" id="mini-count"></span></span>
          <button type="button" class="secondary small" data-action="mini-mc">＋MC</button>
          <button type="button" class="secondary small" data-action="mini-encore">＋アンコール</button>
        </div>
        <ol class="mini-list" id="mini-list"></ol>
      </section>
      <input id="picker-search" type="search" autocomplete="off" placeholder="曲名で探す">
      <div class="filters" id="picker-filters" role="group" aria-label="作品の種類" hidden>
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="album">アルバム</button>
        <button type="button" data-filter="single">シングル・EP</button>
      </div>
      <p id="picker-status" class="hint" role="status"></p>
      <ul id="picker-list" class="picker-list"></ul>
      <p class="hint credit">曲・ジャケットは Apple Music、写真は Deezer の公開データから表示しています。</p>
      <form method="dialog"><button class="secondary close-btn">閉じる</button></form>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
